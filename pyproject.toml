[project]
name = "rl-fundamental-trading"
version = "0.1.0"
description = "RL fundamental trading project"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "rl-ss26-market-data-pipeline",
    "scikit-learn>=1.9.0",
    "xgboost>=3.2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
rl-ss26-market-data-pipeline = { git = "https://gitlab.lrz.de/daniel.maier/rl-ss26-market-data-pipeline.git", rev = "dd253cc5e2ea67c75bdfdc2945d5e1cd73fcfe57" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
