[project]
name = "rl-fundamental-trading-prototype"
version = "0.1.0"
description = "Prototype for RL stock trading with fundamental data"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
rl = [
    "stable-baselines3>=2.3",
]

dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false
